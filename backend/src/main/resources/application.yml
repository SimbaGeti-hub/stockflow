server:
  port: 8081

spring:
  application:
    name: stockflow-api
  datasource:
    url: jdbc:postgresql://localhost:5433/stockflow
    username: stockflow
    password: stockflow_dev
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  security:
    # Development default only. In production, set the JWT_SECRET environment variable.
    jwt-secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    access-token-minutes: 15
    refresh-token-days: 30
